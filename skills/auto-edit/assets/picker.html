<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
html { overflow-wrap: anywhere; }
body { width: 100%; max-width: 52rem; margin: auto; padding: .75rem; padding-bottom: 9rem; }
h1 { font-size: 1.25rem; margin: .25rem 0; }
h2 { font-size: 1.1rem; margin: 1.2rem 0 .2rem; }
h3 { font-size: .95rem; margin: .35rem 0 0; }
.hint, .meta, .note { margin: .15rem 0; font-size: .85rem; }
.meta { opacity: .7; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .6rem; }
.card { min-width: 0; border: 2px solid transparent; border-radius: 12px; padding: .4rem; background: color-mix(in srgb, CanvasText 6%, Canvas); }
.card.on { border-color: #f5b301; background: color-mix(in srgb, #f5b301 18%, Canvas); }
.card img { display: block; width: 100%; height: auto; aspect-ratio: {{ASPECT}}; object-fit: cover; border-radius: 8px; }
.badge { font-size: .7rem; padding: .05rem .35rem; border-radius: 6px; background: #3e8ef7; color: #fff; font-weight: 500; }
.row { display: flex; gap: .35rem; margin-top: .35rem; }
button { min-height: 44px; padding: .45rem .6rem; font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas); background: Canvas; color: CanvasText; }
.row button { flex: 1 1 0; min-width: 0; }
.pick[aria-pressed="true"] { background: #f5b301; color: #111; border-color: #f5b301; font-weight: 600; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: .6rem .75rem calc(.6rem + env(safe-area-inset-bottom)); background: color-mix(in srgb, Canvas 92%, CanvasText); border-top: 1px solid color-mix(in srgb, CanvasText 20%, Canvas); }
.bar p { margin: 0 0 .25rem; font-size: .8rem; opacity: .75; }
#summary { display: block; width: 100%; font: inherit; font-weight: 600; padding: .5rem; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas); background: Canvas; color: CanvasText; user-select: all; -webkit-user-select: all; }
#status { font-size: .8rem; margin-top: .25rem; }
dialog { width: min(26rem, 92vw); max-height: 92vh; padding: .6rem; border-radius: 14px; }
dialog img { display: block; width: 100%; height: auto; max-height: 72vh; object-fit: contain; border-radius: 8px; }
dialog h2 { margin: 0 0 .4rem; font-size: 1rem; }
dialog .row button { flex: 1 1 0; }
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<p class="hint">小图是循环播放的低清动图，阿图已经预选好（蓝标 = 片中现用）。点「选」换掉，点「放大」看大图。选好后把最下面那句话发给阿图。</p>
<p class="hint">只在这个页面内记住，刷新会恢复预选。</p>
{{SECTIONS}}
<div class="bar" role="region" aria-label="选择结果">
  <p>把这句话复制发给阿图（长按可全选）：</p>
  <output id="summary" aria-live="polite"></output>
  <div id="status" role="status"></div>
</div>
<dialog id="viewer" aria-labelledby="viewer-title">
  <h2 id="viewer-title"></h2>
  <img id="viewer-img" alt="" width="216" height="384">
  <p class="note" id="viewer-note"></p>
  <div class="row"><button type="button" id="viewer-pick">选这个</button><button type="button" id="viewer-close">关闭</button></div>
</dialog>
<script>
const DEFAULT = {{DEFAULT}};
const state = {};
const groups = [...document.querySelectorAll('.group')];
groups.forEach(s => state[s.id.slice(2)] = [...DEFAULT[s.id.slice(2)]]);
function render() {
  const parts = [], missing = [];
  groups.forEach(s => {
    const g = s.id.slice(2), need = +s.dataset.need, sel = state[g];
    s.querySelectorAll('.card').forEach(c => {
      const on = sel.includes(c.dataset.label);
      c.classList.toggle('on', on);
      c.querySelector('.pick').setAttribute('aria-pressed', String(on));
    });
    document.getElementById('count-' + g).textContent = `已选 ${sel.length}/${need}`;
    if (sel.length < need) missing.push(s.dataset.name);
    parts.push(s.dataset.name + ' ' + (sel.join('+') || '?'));
  });
  document.getElementById('summary').textContent = parts.join('，');
  document.getElementById('status').textContent = missing.length ? '还没选够：' + missing.join('、') : '已选齐。';
}
function toggle(g, label) {
  const s = document.getElementById('g-' + g), need = +s.dataset.need, sel = state[g];
  const i = sel.indexOf(label);
  if (i >= 0) sel.splice(i, 1);
  else { if (sel.length >= need) sel.shift(); sel.push(label); }
  render();
}
let current = null;
document.querySelectorAll('.card').forEach(c => {
  const g = c.dataset.group, label = c.dataset.label, img = c.querySelector('img');
  if (!c.querySelector('.note')) { const n = document.createElement('p'); n.className = 'note'; n.hidden = true; c.appendChild(n); }
  c.querySelector('.pick').onclick = () => toggle(g, label);
  c.querySelector('.zoom').onclick = () => {
    current = c;
    const v = document.getElementById('viewer-img');
    v.src = img.currentSrc || img.src; v.alt = img.alt;
    document.getElementById('viewer-title').textContent = c.querySelector('h3').textContent;
    document.getElementById('viewer-note').textContent = c.querySelector('.meta').textContent + ' · ' + c.querySelector('.note').textContent;
    document.getElementById('viewer-pick').textContent = state[g].includes(label) ? '取消选择' : '选这个';
    document.getElementById('viewer').showModal();
  };
});
document.getElementById('viewer-pick').onclick = () => {
  if (current) toggle(current.dataset.group, current.dataset.label);
  document.getElementById('viewer').close();
};
document.getElementById('viewer-close').onclick = () => document.getElementById('viewer').close();
render();
</script>
</body>
</html>
